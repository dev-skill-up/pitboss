# A pitboss configuration, checked in as .claude/pitboss/<name>.toml.
# Every key is shown; only [project] owner, repository and main_clone are
# required. The values are an example's; the comments give the defaults.

[project]
owner = "example-org"
repository = "app"
main_clone = "/home/user/app"
# base_branch = "main"
# workspace = the main clone's parent directory
workspace = "/home/user"

[libraries]
# Other repositories the project's sessions change: a bare name is the
# project owner's; "owner/name" for another owner. Default: none.
repositories = ["widgets", "other-org/parser"]
# Libraries whose PRs are merged by hand. Default: none.
no_auto_merge = ["other-org/parser"]

[runners]
# The repositories that share the runners, so whose merge-queue runs count
# for runner pressure. Default: the project and its libraries.
repositories = ["app", "widgets"]
# The file `pitboss pressure`, `pitboss queued` and `pitboss push` append to:
# a line (time, none or hold) for each look at the runners and each queued job.
# Default: pitboss-pressure.log in the main clone's .git directory.
record = "/home/user/app/.git/pitboss-pressure.log"
# Minutes in a row with no hold in the record before a hold lifts: a queued
# job (pitboss queued, a push that went out) restarts them. Default: 15.
quiet_minutes = 15

[review]
# Author associations whose reviews count.
# Default: ["OWNER", "MEMBER", "COLLABORATOR"].
trusted_associations = ["OWNER", "MEMBER", "COLLABORATOR"]
# Repositories whose reviews must take gated_form, strictly, and name the
# exact head. Default: none.
gated = ["other-org/parser"]

[review.form]
# The form of a review comment: line templates, the first matching the
# comment's first line; {sha} is the reviewed head, {verdict} a verdict.
# Default: these three lines, and these two words.
lines = ["## Review", "Reviewed: {sha}", "Verdict: {verdict}"]
approved = "approved"
changes_needed = "changes needed"

[review.gated_form]
# The form in a gated repository. Default: the same as [review.form].
lines = ["## Adversarial review", "Reviewed: {sha}", "Verdict: {verdict}"]

[lint.pr_body]
# Lines a PR body must end with one of (in its last three lines). Default: none,
# so no footer is required; list one only if the project wants a footer.
# footers = ["_Generated by [Claude Code](https://claude.ai/code)_"]

[lint.brief]
# Line starts every brief must have (`pitboss lint brief`). Default: none.
required = ["Overlap:"]

[merge_queue]
# How long a merge-queue run may take before GitHub dequeues it. Default: 60.
timeout_minutes = 60
# Repositories with a merge queue. A PR there that is behind the base needs no
# merge of the base (the queue builds each entry on the current base), so
# `pitboss sweep` offers it no such step. `pitboss slots next` has no update
# kind at all, for any repository. Default: none.
repositories = ["app"]

[slots.brief]
# What the briefs of `pitboss next` and `pitboss slots next` say beyond the process.
# Whether a PR starts as a draft (false: it is opened ready). Default: true.
# drafts = true
# Whether pushes wait for the runners (`pitboss push`); false pushes with
# `git push`. Default: true.
# holds = true
# Facts of the project every worker brief states, such as the compiler's path,
# and every review brief states. Default: none.
# worker_lines = ["Compiler: /home/user/app/dist/debug/bats"]
# review_lines = []

[worktrees]
# How long a worktree must be untouched before it may be stale. Default: 3.
idle_hours = 3

[clean]
# `pitboss clean-container`: directories whose entries are removed when nothing
# in them changed in the idle hours (see [worktrees]). Absolute paths; only an
# entry directly in one is ever removed. Default: none.
scratch = ["/tmp/claude-0"]
# Paths never removed (shared caches, toolchain homes, the persistent checkout):
# a path here, one that holds it or lies in it. A directory that holds a file
# named .pitboss-live at any depth, or lies under one that does, is live too.
# Absolute paths. Default: none.
live = ["/home/user/.cache/build"]
# A sweep prints DISK PRESSURE when a filesystem of the workspace or of a scratch
# directory has less free than this many GiB; 0 never warns. Default: 5.
min_free_gib = 5
# What a sweep does with the worktrees whose work is finished (PR merged or
# closed, or tip in the base branch): "auto" removes each that passes the safety
# test (every commit on a remote branch, no changed tracked file, nothing
# changed in the idle hours, no .pitboss-live marker, not the directory the
# sweep runs in or one above it; one with untracked files is kept too, since
# git worktree remove refuses it) and prints REMOVED
# WORKTREE, or KEPT WORKTREE and why; "list" only prints STALE WORKTREE for
# them (pitboss clean-worktrees removes those). Default: "auto".
worktrees = "auto"

[sweep]
# The questions each sweep ends with. Default: whether any ticket can be
# closed, and whether any blocked ticket is unblocked.
# reminders = ["..."]

[slots]
# The ledger: a file outside the repository.
# Default: <main_clone>/.git/pitboss-slots.json
ledger = "/home/user/app/.git/pitboss-slots.json"
# The slot log: a line for each change of a slot's state (`pitboss slots report`).
# Default: the ledger's name ending in .log
log = "/home/user/app/.git/pitboss-slots.log"
# The models workers run on, smallest first. Default: none.
models = ["small-model", "large-model"]
# The ticket labels that are offered, highest priority first; a ticket with
# none of them is never offered. Default: none.
priority_labels = ["urgent", "soon", "later"]
# The slots `pitboss sweep` starts a ledger with when the ledger file does not
# exist. Default: none. `pitboss slots` never creates the ledger: it exits 1 with
# LEDGER MISSING, and the owner creates the file.
default = [
    { name = "large-1", model = "large-model" },
    { name = "small-1", model = "small-model" },
]

[slots.model_labels]
# A label, and the smallest model a ticket with it may go to. Default: none.
"needs-large-model" = "large-model"
