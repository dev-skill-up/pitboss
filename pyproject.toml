[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pitboss"
version = "0.1.0"
description = "Read GitHub pull requests and tickets, say each one's next step, act on it"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
tests = ["pyhamcrest", "coverage"]

[project.scripts]
pitboss = "pitboss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
