# The one path's seeded violations, on every pull request (keyword: one-path); the
# mutants are mutation.yml, which no pull request runs.
name: seeded

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # each one-path proof fails on a seeded violation (the plan's section 6.5); the
  # seeds are edits parsed in memory, never run
  seeded:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Set up Python 3.14
        uses: actions/setup-python@57ded4d7d5e986d7296eab16560982c6dd7c923b
        with:
          python-version: "3.14"

      - name: Install Nox
        run: pip install nox

      - name: Run the seeded violations
        run: nox --force-color --python=3.14 --session=seeded
